name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: windows
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app and DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/bundle.sh "$VERSION"
          scripts/make-dmg.sh "$VERSION"
      - uses: actions/download-artifact@v4
        with:
          name: deskling-windows
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip --generate-notes
